  <script>
    (function () {
      var ITERATIONS = 100000;
      var SESSION_KEY = "opg-gate";
      var screen = document.getElementById("gate-screen");
      var form = document.getElementById("gate-form");
      var input = document.getElementById("gate-password");
      var error = document.getElementById("gate-error");
      var submit = document.getElementById("gate-submit");

      function showScreen() {
        screen.hidden = false;
        input.focus();
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
        submit.disabled = false;
        submit.textContent = "Continue";
        input.focus();
        input.select();
      }

      function bytesFromBase64(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function reveal(html) {
        document.open();
        document.write(html);
        document.close();
      }

      async function decryptHtml(password) {
        if (!window.crypto || !crypto.subtle) {
          throw new Error("This browser cannot unlock the site.");
        }
        var packed = bytesFromBase64(document.getElementById("gate-payload").textContent.trim());
        var salt = packed.slice(0, 16);
        var iv = packed.slice(16, 28);
        var data = packed.slice(28);
        var keyMaterial = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        var key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
        return new TextDecoder().decode(plain);
      }

      async function unlock(password, fromSession) {
        submit.disabled = true;
        submit.textContent = "Checking…";
        error.hidden = true;
        try {
          var html = await decryptHtml(password);
          try { sessionStorage.setItem(SESSION_KEY, password); } catch (e) { /* private mode */ }
          reveal(html);
        } catch (err) {
          try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
          showScreen();
          if (fromSession) {
            submit.disabled = false;
            submit.textContent = "Continue";
            return;
          }
          var unavailable = err && err.message && err.message.indexOf("cannot unlock") !== -1;
          showError(unavailable ? err.message : "Incorrect password.");
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = input.value.trim();
        if (!password) {
          showError("Enter the password.");
          return;
        }
        unlock(password, false);
      });

      var saved = "";
      try { saved = sessionStorage.getItem(SESSION_KEY) || ""; } catch (e) { saved = ""; }
      if (saved) {
        unlock(saved, true);
      } else {
        showScreen();
      }
    })();
  </script>
